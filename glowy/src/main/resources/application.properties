spring.application.name=glowy

# Banco H2 em memória + Console Web
spring.datasource.url=jdbc:h2:mem:glowydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate (o dialeto H2 é detectado automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger / Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Hospedagem (Render): porta vem da variável PORT; headers do proxy para IP real e URLs https
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Chaves iniciais de teste (em produção, defina GLOWY_ADMIN_KEY e GLOWY_CLIENTE_KEY)
glowy.admin-key=${GLOWY_ADMIN_KEY:glowy-admin-key-999}
glowy.cliente-key=${GLOWY_CLIENTE_KEY:glowy-dev-key-123}